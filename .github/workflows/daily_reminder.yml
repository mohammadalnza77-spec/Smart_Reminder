name: Daily Smart Contract Reminder

on:
  schedule:
    # يعمل تلقائياً كل يوم الساعة 8:00 صباحاً بتوقيت السعودية (5:00 UTC)
    - cron: '0 5 * * *'
  workflow_dispatch: # يتيح لكِ تشغيله يدوياً في أي وقت للاختبار

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run Reminder Script
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python cron_job.py
